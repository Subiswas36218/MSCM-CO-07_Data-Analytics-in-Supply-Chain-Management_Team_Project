name: Execute DASCM 2026 Notebooks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebooks:
    name: Execute All Four Jupyter Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create executed notebooks directory
        run: |
          mkdir -p executed_notebooks

      - name: Execute Manufacturing Energy Consumption notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output-dir executed_notebooks \
            DASCM_2026_Part1_Manufacturing_Energy_Consumption_EDA_with_saved_plots.ipynb

      - name: Execute Port Logistics Dispatching notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output-dir executed_notebooks \
            DASCM_2026_Part1_Port_Logistics_Dispatching_EDA.ipynb

      - name: Execute Smart Logistics Supply Chain notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output-dir executed_notebooks \
            DASCM_2026_Part1_Smart_Logistics_Supply_Chain_EDA.ipynb

      - name: Execute E-Commerce Sales and Customer Insights notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output-dir executed_notebooks \
            DASCM_2026_Part1_ECommerce_Sales_Customer_Insights_EDA.ipynb

      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed_notebooks/
          if-no-files-found: error